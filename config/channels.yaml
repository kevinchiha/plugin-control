# COMMAND PALETTE KEYBINDING
# Manage the "Plugin Control" binding in:
# ~/.config/hypr/bindings.lua

version: 2
refresh_minutes: 30
allow_unlisted_installs: false

settings:
  tray-icon-hidden: false
  preview-pane-hidden: false

channels:
  - id: marketplace
    name: Omarchy Plugins Marketplace
    type: marketplace-catalog
    enabled: true
    catalog_url: https://omarchyplugins.com/catalog.json
    website_url: https://omarchyplugins.com/
    # Views, copies and hearts are counted separately from the catalog.
    # Remove this line to stop Plugin Control contacting the counter service;
    # stars keep working either way.
    engagement_url: https://api.omarchyplugins.com/v1/stats

  - id: hancore-submissions
    name: Unlisted marketplace submissions
    type: github-submissions
    enabled: false
    repository: HANCORE-linux/omarchy-plugin-marketplace
    required_labels:
      - submission
      - validated
    excluded_labels:
      - listed
      - needs-fixes
